{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Опросы{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="{% url 'surveys:list' %}">Опросы</a>
    <nav class="header__nav">
      {% if user.is_authenticated %}
        <span class="header__user">{{ user.username }}</span>
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">Редактор</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="link-button" type="submit">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}?next={{ request.path|urlencode }}">Войти</a>
      {% endif %}
    </nav>
  </header>
  <main class="content">
    {% for message in messages %}
      <div class="alert alert--{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
